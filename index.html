<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест: Кибербезопасность</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><main>
<section id="start">
<h1>Кибербезопасность: угрозы безопасности информации</h1>
<p class="lead">40 вопросов, в каждом 5 вариантов. Правильный ответ показывается сразу после выбора, итоговый результат — в конце.</p>
<button class="btn" id="go">Начать тест</button>
</section>
<section id="quiz" class="hide">
<div class="top"><span id="cnt"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><h2 id="q"></h2><div id="opts"></div>
<div class="nav"><button class="btn" id="next" disabled>Дальше</button></div></div>
</section>
<section id="res" class="hide">
<div class="card"><div class="score" id="rs"></div><div class="pct" id="rp"></div><div class="grade" id="rg"></div>
<div class="row"><button class="btn" id="again">Пройти заново</button><button class="btn ghost" id="wr">Только ошибки</button></div></div>
<div class="rev" id="rev"></div>
</section>
</main>
<script src="script.js"></script></body></html>
